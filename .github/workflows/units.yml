---
# Unit tests for ansible.proxmox collection
#
# https://docs.ansible.com/projects/ansible/latest/dev_guide/testing_units.html
#
# Tests run inside Docker via ansible-test against all supported ansible-core versions.
# Add new versions from https://github.com/ansible-collections/news-for-maintainers
# and drop EOL versions in a timely manner.

name: Units
on:
  push:
    branches:
      - main
      - stable-*
  pull_request:
  schedule:
    # Run daily at 06:00 UTC to catch issues from new ansible-test releases
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number || github.sha
    }}
  cancel-in-progress: true

jobs:

  units:
    name: Units (Ⓐ${{ matrix.ansible }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        ansible:
          - stable-2.19
          - stable-2.20
          - stable-2.21
          - stable-2.22
          - devel
        # - milestone

    steps:
      - name: >-
          Perform unit testing against
          Ansible version ${{ matrix.ansible }}
        uses: ansible-community/ansible-test-gh-action@release/v1
        with:
          ansible-core-version: ${{ matrix.ansible }}
          testing-type: units
          pre-test-cmd: >-
            python -m pip install -r requirements.txt
            -r tests/unit/requirements.txt
          pull-request-change-detection: false
          # codecov-token: ${{ secrets.CODECOV_TOKEN }}

  check:  # Branch-protection aggregator — passes when all matrix legs pass
    if: always()
    needs:
      - units
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
