---
name: Run collection certification checks

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cert-ver-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  certification_check:
    uses: ansible-collections/partner-certification-checker/.github/workflows/certification-reusable.yml@6892f6bc09050f123f4ed913b7fc7c1ac693c8b4 # v3.0.1
