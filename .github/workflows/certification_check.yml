---
name: Run collection certification checks

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cert-ver-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  certification_reusable:
    name: certification_check
    uses: ansible-collections/partner-certification-checker/.github/workflows/certification-reusable.yml@2974d3086a097221a63ed9789aaed798acd98411 # v3.0.1

  # Temporary until the upstream reusable workflow includes Core 2.22.
  certification_check:
    name: Sanity (Ⓐstable-2.22) (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Run Core 2.22 sanity tests
        uses: ansible-community/ansible-test-gh-action@9cdbd323f59530c0f43669f1168c8ef4a8c06d41
        with:
          ansible-core-version: stable-2.22
          origin-python-version: "3.13"
          target-python-version: "3.13"
          testing-type: sanity
          collection-root: "."
          pull-request-change-detection: false
