---
- name: Remove LXC clone fixtures
  ansible.proxmox.proxmox_lxc:
    node: "{{ proxmox_node }}"
    vmid: "{{ item }}"
    state: absent
    power_cycle: 'off'
  loop:
    - "{{ lxc_clone_new_vmid }}"
    - "{{ lxc_clone_source_vmid }}"
