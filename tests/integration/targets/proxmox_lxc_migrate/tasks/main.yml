---
- name: Exercise LXC migration between cluster nodes
  module_defaults:
    group/ansible.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_port: "{{ proxmox_api_port | default(8006) }}"
      api_user: "{{ proxmox_api_user | default(omit, true) }}"
      api_password: "{{ proxmox_api_password | default(omit, true) }}"
      api_token_id: "{{ proxmox_api_token_id | default(omit, true) }}"
      api_token_secret: >-
        {{ proxmox_api_token_secret | default(omit, true) }}
      ca_path: "{{ proxmox_ca_path | default(omit, true) }}"
      validate_certs: "{{ proxmox_validate_certs | default(true) }}"
  block:
    - name: Generate the LXC fixture root password
      ansible.builtin.set_fact:
        lxc_migrate_root_password: >-
          {{ lookup('password', '/dev/null length=32') }}
      no_log: true

    - name: Check the migration VMID is unused on the source node
      ansible.proxmox.proxmox_lxc_info:
        node: "{{ lxc_migrate_source_node }}"
        vmid: "{{ lxc_migrate_vmid }}"
      register: lxc_migrate_source_before

    - name: Check the migration VMID is unused on the target node
      ansible.proxmox.proxmox_lxc_info:
        node: "{{ lxc_migrate_target_node }}"
        vmid: "{{ lxc_migrate_vmid }}"
      register: lxc_migrate_target_before

    - name: Check the migration VMID is unused by QEMU on the source node
      ansible.proxmox.proxmox_vm_info:
        node: "{{ lxc_migrate_source_node }}"
        vmid: "{{ lxc_migrate_vmid }}"
      register: lxc_migrate_source_qemu_before

    - name: Check the migration VMID is unused by QEMU on the target node
      ansible.proxmox.proxmox_vm_info:
        node: "{{ lxc_migrate_target_node }}"
        vmid: "{{ lxc_migrate_vmid }}"
      register: lxc_migrate_target_qemu_before

    - name: Refuse to modify an existing guest
      ansible.builtin.assert:
        that:
          - lxc_migrate_source_before.lxcs | length == 0
          - lxc_migrate_target_before.lxcs | length == 0
          - lxc_migrate_source_qemu_before.vms | length == 0
          - lxc_migrate_target_qemu_before.vms | length == 0
        fail_msg: >-
          The random LXC migration VMID is already in use; rerun the target.

    - name: Claim ownership of the LXC migration fixture
      ansible.builtin.set_fact:
        lxc_migrate_cleanup_allowed: true

    - name: Create a stopped LXC migration fixture
      ansible.proxmox.proxmox_lxc:
        node: "{{ lxc_migrate_source_node }}"
        vmid: "{{ lxc_migrate_vmid }}"
        hostname: "ansible-lxc-migrate-{{ lxc_migrate_vmid }}"
        ostemplate: "{{ lxc_migrate_template }}"
        password: "{{ lxc_migrate_root_password }}"
        unprivileged: true
        rootfs: local-lvm:8
        cores: 1
        memory: 512
        ostype: fedora
        power_cycle: 'off'
        state: present
      register: lxc_migrate_create

    - name: Assert the LXC migration fixture was created
      ansible.builtin.assert:
        that:
          - lxc_migrate_create is changed

    - name: Predict migration in check mode
      ansible.proxmox.proxmox_lxc_migrate:
        node: "{{ lxc_migrate_source_node }}"
        vmid: "{{ lxc_migrate_vmid }}"
        target: "{{ lxc_migrate_target_node }}"
        target_storage: local-lvm
        task_timeout: 1800
      check_mode: true
      register: lxc_migrate_check_mode

    - name: Assert migration preconditions were checked without submission
      ansible.builtin.assert:
        that:
          - lxc_migrate_check_mode is changed
          - lxc_migrate_check_mode.preconditions.running is defined
          - lxc_migrate_check_mode.task_upid is not defined

    - name: Verify check mode kept the container on the source node
      ansible.proxmox.proxmox_lxc_info:
        node: "{{ lxc_migrate_source_node }}"
        vmid: "{{ lxc_migrate_vmid }}"
      register: lxc_migrate_after_check_mode

    - name: Assert check mode did not migrate the container
      ansible.builtin.assert:
        that:
          - lxc_migrate_after_check_mode.lxcs | length == 1

    - name: Migrate the LXC container to the target node
      ansible.proxmox.proxmox_lxc_migrate:
        node: "{{ lxc_migrate_source_node }}"
        vmid: "{{ lxc_migrate_vmid }}"
        target: "{{ lxc_migrate_target_node }}"
        target_storage: local-lvm
        task_timeout: 1800
      register: lxc_migrate_result

    - name: Assert LXC migration completed
      ansible.builtin.assert:
        that:
          - lxc_migrate_result is changed
          - lxc_migrate_result.preconditions.running is defined
          - lxc_migrate_result.task_upid is defined

    - name: Verify the container is present on the target node
      ansible.proxmox.proxmox_lxc_info:
        node: "{{ lxc_migrate_target_node }}"
        vmid: "{{ lxc_migrate_vmid }}"
      register: lxc_migrate_target_after

    - name: Verify the container is absent from the source node
      ansible.proxmox.proxmox_lxc_info:
        node: "{{ lxc_migrate_source_node }}"
        vmid: "{{ lxc_migrate_vmid }}"
      register: lxc_migrate_source_after

    - name: Assert the migrated container is only on the target node
      ansible.builtin.assert:
        that:
          - lxc_migrate_target_after.lxcs | length == 1
          - >-
            lxc_migrate_target_after.lxcs[0].hostname
            == 'ansible-lxc-migrate-' ~ lxc_migrate_vmid
          - lxc_migrate_source_after.lxcs | length == 0

  always:
    - name: Remove the LXC migration fixture from the target node
      ansible.proxmox.proxmox_lxc:
        node: "{{ lxc_migrate_target_node }}"
        vmid: "{{ lxc_migrate_vmid }}"
        state: absent
        power_cycle: 'off'
      when:
        - lxc_migrate_cleanup_allowed | default(false)
        - lxc_migrate_create is defined
        - lxc_migrate_create is changed

    - name: Remove the LXC migration fixture from the source node
      ansible.proxmox.proxmox_lxc:
        node: "{{ lxc_migrate_source_node }}"
        vmid: "{{ lxc_migrate_vmid }}"
        state: absent
        power_cycle: 'off'
      when:
        - lxc_migrate_cleanup_allowed | default(false)
        - lxc_migrate_create is defined
        - lxc_migrate_create is changed
