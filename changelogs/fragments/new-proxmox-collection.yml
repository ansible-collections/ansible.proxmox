major_changes:
  - >-
    Introduce the new Ansible Proxmox collection with shared PVE and PBS client
    handling.
  - >-
    PVE and PBS client handling for HTTPS password, HTTPS token, and
    OpenSSH transports, with composable connection documentation and
    transport-specific SSH options.
  - >-
    Reusable info, action, resource lifecycle, and asynchronous task
    helpers.
  - >-
    Validate the effective Administrator role permissions on the relevant PVE
    API path before VM operations.
